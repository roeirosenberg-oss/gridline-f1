; Gridline F1 — standalone F1 desk display for the ESP32-2432S028 ("Cheap Yellow Display")
;
; Build:   pio run -e st7789            (primary display controller, landscape by default)
;          pio run -e st7789_portrait   (same, portrait by default)
;          pio run -e ili9341 / ili9341_portrait (optional alternative controller)
; The orientation can also be changed on the device: Settings -> Orientation.
; Release: python tools/make_release.py
;
; All dependencies are pinned to exact versions for reproducible builds.

[platformio]
default_envs = st7789
description = Gridline F1 desk display (ESP32-2432S028, 320x240 landscape)

[common]
platform = espressif32@6.9.0              ; arduino-esp32 2.0.17 (ESP-IDF 4.4.7)
board = esp32dev
framework = arduino
board_build.partitions = partitions_gridline_4mb.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  https://github.com/bblanchon/ArduinoJson.git#v7.4.2
  https://github.com/Bodmer/TFT_eSPI.git#V2.5.43
build_unflags = -std=gnu++11
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
build_flags =
  -std=gnu++17
  -Os
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_ENABLE_PROGMEM=1
  ; ---- TFT_eSPI configuration (no User_Setup.h editing needed) ----
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DSMOOTH_FONT=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1   ; touch uses its own driver on a separate SPI bus

[env:st7789]
extends = common
build_flags =
  ${common.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_OFF=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DGL_DISPLAY_PROFILE=\"ST7789\"

[env:st7789_portrait]
extends = env:st7789
build_flags =
  ${env:st7789.build_flags}
  -DGL_DEFAULT_ROTATION=0

[env:ili9341]
extends = common
build_flags =
  ${common.build_flags}
  -DILI9341_2_DRIVER=1
  -DGL_DISPLAY_PROFILE=\"ILI9341\"

[env:ili9341_portrait]
extends = env:ili9341
build_flags =
  ${env:ili9341.build_flags}
  -DGL_DEFAULT_ROTATION=0

; Test-only build for the ESP32 QEMU emulator (no radio). Not part of the release.
[env:qemu_selftest]
extends = env:st7789
build_flags =
  ${env:st7789.build_flags}
  -DGL_EMULATOR_SELFTEST=1
  -Itest/emulator
